name: Publish to NPM

# Trusted Publishing (OIDC) Configuration:
# - Target package: @epoch32/visage
# - Repository: Epoch32/visage
# - Workflow filename: publish.yml
# - Authentication: Passwordless via GitHub Actions OIDC (id-token: write)

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js for Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Full Quality & Verification Suite
        run: bun run verify

      - name: Build Distribution Bundles
        run: bun run build

      - name: Publish to NPM via Trusted Publishing (OIDC)
        run: npm publish --provenance --access public
        env:
          # When NPM Trusted Publishing is configured, OIDC token exchange is automatic.
          # If an NPM_TOKEN secret exists, it also works seamlessly as a fallback.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
