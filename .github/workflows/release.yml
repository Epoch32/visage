name: Release & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish current version to NPM (bypass release-please check)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build & Publish to NPM
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.force_publish == true }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure latest npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Ensure no stale auth token in npm config
        run: npm config delete //registry.npmjs.org/:_authToken --location=user 2>/dev/null || true

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Full Quality & Verification Suite
        run: bun run verify

      - name: Build Distribution Bundles
        run: bun run build

      - name: Publish to NPM via Trusted Publishing (OIDC)
        run: npm publish --provenance --access public
